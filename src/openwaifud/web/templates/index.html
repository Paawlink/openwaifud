<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWaifuD 设备管理</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3d;
    --text: #e6e8ef;
    --muted: #8b90a1;
    --accent: #7c9cff;
    --ok: #4ade80;
    --warn: #facc15;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--accent); }
  .device {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    flex-wrap: wrap;
  }
  .device + .device { border-top: 1px solid var(--border); }
  .device-info { flex: 1; min-width: 200px; }
  .device-name { font-size: 15px; font-weight: 600; }
  .device-addr { font-size: 12px; color: var(--muted); font-family: ui-monospace, monospace; margin-top: 2px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.err { color: var(--err); border-color: var(--err); }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 13px; color: var(--muted); }
  input {
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f1117;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 12px; }
  .btn-row button { flex: 1; }
  button.danger {
    background: transparent;
    border: 1px solid var(--err);
    color: var(--err);
  }
  #msg { font-size: 13px; min-height: 18px; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
</style>
</head>
<body>
<div class="container">
  <h1>OpenWaifuD 设备管理</h1>
  <p class="subtitle">已蓝牙连接的硬件设备与 WiFi 配网</p>

  <div class="card">
    <h2>设备列表</h2>
    <div id="devices"><p class="empty">加载中…</p></div>
  </div>

  <div class="card">
    <h2>WiFi 配网</h2>
    <form id="provision-form">
      <div>
        <label for="ssid">WiFi 名称（SSID）</label>
        <input id="ssid" name="ssid" maxlength="32" required autocomplete="off" placeholder="例如 MyHomeWiFi">
      </div>
      <div>
        <label for="password">WiFi 密码（开放网络可留空）</label>
        <input id="password" name="password" type="password" maxlength="64" autocomplete="off" placeholder="密码">
      </div>
      <div class="btn-row">
        <button id="submit-btn" type="submit">下发配网</button>
        <button id="forget-btn" type="button" class="danger">忘记网络</button>
      </div>
      <p id="msg"></p>
    </form>
  </div>

  <div class="card">
    <h2>对话模型</h2>
    <form id="chat-config-form">
      <div>
        <label for="chat-base-url">API 地址（OpenAI 兼容，如 https://api.openai.com/v1）</label>
        <input id="chat-base-url" maxlength="200" autocomplete="off" placeholder="https://api.openai.com/v1">
      </div>
      <div>
        <label for="chat-api-key">API Key（留空表示保留已保存的 Key）</label>
        <input id="chat-api-key" type="password" maxlength="200" autocomplete="off" placeholder="sk-...">
      </div>
      <div>
        <label for="chat-model">模型名</label>
        <input id="chat-model" maxlength="100" autocomplete="off" placeholder="gpt-4o-mini">
      </div>
      <button id="chat-config-btn" type="submit">保存配置</button>
      <p id="chat-config-msg"></p>
    </form>
  </div>

  <div class="card">
    <h2>对话测试</h2>
    <form id="chat-form">
      <div>
        <label for="chat-input">消息（POST /api/v1/chat，同步返回回复）</label>
        <input id="chat-input" maxlength="4000" autocomplete="off" placeholder="你好呀">
      </div>
      <button id="chat-btn" type="submit">发送</button>
      <p id="chat-msg"></p>
      <pre id="chat-reply" style="white-space: pre-wrap; font-size: 13px; color: var(--text); display: none; border-top: 1px solid var(--border); padding-top: 12px;"></pre>
    </form>
  </div>
</div>

<script>
const WIFI_LABELS = {
  unknown: ["未知", ""],
  idle: ["WiFi 未配置", ""],
  connecting: ["WiFi 连接中…", "warn"],
  connected: ["WiFi 已连接", "ok"],
  failed: ["WiFi 连接失败", "err"],
  disconnected: ["WiFi 已断开", "err"],
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

async function refreshDevices() {
  try {
    const resp = await fetch("/api/v1/devices");
    const data = await resp.json();
    const box = document.getElementById("devices");
    if (!data.devices || data.devices.length === 0) {
      box.innerHTML = '<p class="empty">暂无设备。请确认硬件已开机且守护进程已连接蓝牙。</p>';
      return;
    }
    box.innerHTML = data.devices.map(d => {
      const ble = d.ble_connected
        ? '<span class="badge ok">蓝牙已连接</span>'
        : '<span class="badge err">蓝牙未连接</span>';
      const [label, cls] = WIFI_LABELS[d.wifi_status] || WIFI_LABELS.unknown;
      const detail = d.wifi_status === "connected" && d.wifi_detail
        ? " (" + esc(d.wifi_detail) + ")" : "";
      return '<div class="device">' +
        '<div class="device-info">' +
          '<div class="device-name">' + esc(d.name || "未知设备") + '</div>' +
          '<div class="device-addr">' + esc(d.address || "-") + '</div>' +
        '</div>' +
        '<div class="badges">' + ble +
          '<span class="badge ' + cls + '">' + label + detail + '</span>' +
        '</div>' +
      '</div>';
    }).join("");
  } catch (e) {
    /* 网络抖动时保留上次内容 */
  }
}

document.getElementById("provision-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("submit-btn");
  const msg = document.getElementById("msg");
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "下发中…";
  try {
    const resp = await fetch("/api/v1/wifi/provision", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ssid: document.getElementById("ssid").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await resp.json();
    if (resp.ok) {
      msg.className = "ok";
      msg.textContent = "已下发配网指令，设备正在连接 WiFi…";
    } else {
      msg.className = "err";
      msg.textContent = data.error || ("下发失败（HTTP " + resp.status + "）");
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "请求失败，请检查守护进程是否运行";
  } finally {
    btn.disabled = false;
    refreshDevices();
  }
});

document.getElementById("forget-btn").addEventListener("click", async () => {
  if (!confirm("确定要让设备忘记当前网络吗？\n设备将断开 WiFi 并清除已保存的凭据。")) {
    return;
  }
  const btn = document.getElementById("forget-btn");
  const msg = document.getElementById("msg");
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "下发中…";
  try {
    const resp = await fetch("/api/v1/wifi/forget", { method: "POST" });
    const data = await resp.json();
    if (resp.ok) {
      msg.className = "ok";
      msg.textContent = "已下发忘记网络指令，设备将断开 WiFi 并清除凭据";
    } else {
      msg.className = "err";
      msg.textContent = data.error || ("下发失败（HTTP " + resp.status + "）");
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "请求失败，请检查守护进程是否运行";
  } finally {
    btn.disabled = false;
    refreshDevices();
  }
});

refreshDevices();
setInterval(refreshDevices, 2000);

/* ---------- 对话模型配置与即时对话测试 ---------- */

async function loadChatConfig() {
  try {
    const resp = await fetch("/api/v1/chat/config");
    if (!resp.ok) return;
    const cfg = await resp.json();
    document.getElementById("chat-base-url").value = cfg.base_url || "";
    document.getElementById("chat-model").value = cfg.model || "";
    document.getElementById("chat-api-key").placeholder =
      cfg.api_key_set ? "已保存，留空表示不修改" : "sk-...";
  } catch (e) {
    /* 守护进程未启动时保持空白 */
  }
}

document.getElementById("chat-config-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("chat-config-btn");
  const msg = document.getElementById("chat-config-msg");
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "保存中…";
  try {
    const resp = await fetch("/api/v1/chat/config", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        base_url: document.getElementById("chat-base-url").value,
        api_key: document.getElementById("chat-api-key").value,
        model: document.getElementById("chat-model").value,
      }),
    });
    const data = await resp.json();
    if (resp.ok) {
      msg.className = "ok";
      msg.textContent = "配置已保存";
      document.getElementById("chat-api-key").value = "";
      loadChatConfig();
    } else {
      msg.className = "err";
      msg.textContent = data.error || ("保存失败（HTTP " + resp.status + "）");
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "请求失败，请检查守护进程是否运行";
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("chat-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById("chat-btn");
  const msg = document.getElementById("chat-msg");
  const replyBox = document.getElementById("chat-reply");
  const message = document.getElementById("chat-input").value.trim();
  if (!message) return;
  btn.disabled = true;
  msg.className = "";
  msg.textContent = "等待回复中（可能需要几十秒）…";
  replyBox.style.display = "none";
  try {
    const resp = await fetch("/api/v1/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await resp.json();
    if (resp.ok) {
      msg.textContent = "";
      replyBox.textContent = data.reply || "";
      replyBox.style.display = "block";
    } else {
      msg.className = "err";
      msg.textContent = data.error || ("请求失败（HTTP " + resp.status + "）");
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "请求失败，请检查守护进程是否运行";
  } finally {
    btn.disabled = false;
  }
});

loadChatConfig();
</script>
</body>
</html>
